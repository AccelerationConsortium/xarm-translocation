[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-motion"
version = "0.4.0a1"
authors = [
  { name="Yang Cao", email="cyrilcaoyang@gmail.com" },
]
description = "Graph-based laboratory robot application with a bundled UI and optional xArm, UR, and planned MG400 drivers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["robotics", "xarm", "ufactory", "gripper", "linear-track", "force-torque", "automation", "pyxarm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
    "fastapi>=0.136.1,<0.137",
    "starlette>=1.0,<1.1",
    "uvicorn[standard]>=0.46,<0.47",
    "websockets>=16,<17",
    # Lab-assistant chatbox (natural-language motion control) via OpenRouter's
    # OpenAI-compatible API. The feature degrades gracefully when the key is
    # unset, but the SDK ships by default.
    "openai>=2.46,<3",
    # Loads OPENROUTER_API_KEY from a local .env file (git-ignored).
    "python-dotenv>=1.0.0",
    "sdl-lab-contract",
]

[tool.uv.sources]
sdl-lab-contract = { git = "https://github.com/AccelerationConsortium/sdl-lab-contract", tag = "v1.2.0" }

[project.optional-dependencies]
xarm = ["xarm-python-sdk>=1.13.0"]
ur = ["ur-rtde>=1.6,<2", "scipy>=1.11"]
# Reserved for future MG400 support. Installing it does not add a driver yet.
mg400 = []
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
    "pytest-mock>=3.0",
    "pytest-cov>=4.0",
    "pytest-docker>=2.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
    "docker>=6.0"
]

[project.urls]
Homepage = "https://github.com/AccelerationConsortium/xarm-translocation"
Documentation = "https://github.com/AccelerationConsortium/xarm-translocation#readme"
Repository = "https://github.com/AccelerationConsortium/xarm-translocation.git"
Issues = "https://github.com/AccelerationConsortium/xarm-translocation/issues"

[project.scripts]
robot-motion = "robot_motion.cli:main"
pyxarm = "cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.md", "*.html", "*.css", "*.js"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = "test_*.py"
python_classes = "Test*" 
python_functions = "test_*"
addopts = "--verbose --tb=short"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "docker: marks tests that require Docker (deselect with '-m \"not docker\"')"
]

[tool.readme]
# Note: Docker setup uses bash script at src/docker/docker_setup.sh
# For full setup, see README_DOCKER.md

[tool.coverage.run]
