# Motion-graph interlock data (schema 0.2).
#
# A NODE is an ARM POSITION only: a named arm pose from joint_config.yaml
# (the `arm` field) at a rail location (linear_track_config.yaml). One node
# per physical position — the gripper is NOT part of node identity.
#
# The gripper is modelled as LEAVES on each node:
#   - `gripper_states`: catalog states you may OCCUPY at the node
#     (default: [empty] when omitted).
#   - `gripper_transitions`: [from, to] state changes allowed WHILE PARKED
#     at the node (grip / release / narrow). The gripper never changes
#     during motion — an edge is traversable with state G only if G is
#     allowed at BOTH endpoints.
#
# The global catalog below defines each state's commanded stroke and its
# verification intent:
#   grasp    → an object is expected: the jaws must settle ABOVE the
#              commanded stroke; reaching it exactly means nothing was
#              gripped → error.
#   position → free travel: the jaws must REACH the commanded stroke;
#              stalling early means blocked → error.
#   none     → no verification (empty / fully open).
#
# Loader enforcement (src/core/motion_graph.py::_validate_topology):
# unique (arm, rail) per node, node states exist in the catalog,
# transitions stay within the node's own states, edge endpoints share at
# least one state, strokes within 71-150 (Bio Gen2).
#
# Rail locations: Home=0, Deck=550, Hood=550, Cytation=700, Plateloc=700.

schema_version: "0.2"

# ── Gripper-state catalog ───────────────────────────────────────────────────
gripper_states:
  empty: {stroke: 150, intent: none}         # fully open, holding nothing
  grip_120: {stroke: 120, intent: grasp}     # gripping the tray (long side)
  reach_90: {stroke: 90, intent: position}   # narrow for clearance, no payload
  grip_80: {stroke: 80, intent: grasp}       # gripping the tray (short side)

# ── Nodes ──────────────────────────────────────────────────────────────────
nodes:
  # ── Generic safe poses (rail Home). Pass-through in any gripper state. ──
- {id: robot_home, arm: robot_home, rail: Home, gripper_states: [empty, grip_120, 
      reach_90, grip_80], tags: [safe, home]}
- {id: robot_home_back, arm: robot_home_back, rail: Home, gripper_states: [empty,
    grip_120, reach_90, grip_80], tags: [safe]}
- {id: robot_home_left, arm: robot_home_left, rail: Home, gripper_states: [empty,
    grip_120, reach_90, grip_80], tags: [safe]}
- {id: robot_home_right, arm: robot_home_right, rail: Home, gripper_states: [
      empty, grip_120, reach_90, grip_80], tags: [safe]}

  # ── Opentrons OT-2 (rail Home). Per-slot pick/place: the low pose is
  #    where grip/release happens; press poses are grip-only. ──
- {id: opentrons_home, arm: opentrons_home, rail: Home, gripper_states: [empty, 
      grip_120, reach_90, grip_80], tags: [opentrons, transit]}

- {id: opentrons_2_high, arm: opentrons_2_high, rail: Home, gripper_states: [
      empty, grip_120, reach_90, grip_80], tags: [opentrons, slot2]}
- {id: opentrons_2_low, arm: opentrons_2_low, rail: Home, gripper_states: [empty,
    grip_120, reach_90, grip_80], gripper_transitions: [[empty, grip_120], [
      grip_120, empty]], tags: [opentrons, slot2]}
- {id: opentrons_2_low_press, arm: opentrons_2_low_press, rail: Home, 
    gripper_states: [grip_120], tags: [opentrons, slot2]}

- {id: opentrons_4_high, arm: opentrons_4_high, rail: Home, gripper_states: [
      empty, grip_120, reach_90, grip_80], tags: [opentrons, slot4]}
- {id: opentrons_4_low, arm: opentrons_4_low, rail: Home, gripper_states: [empty,
    grip_120, reach_90, grip_80], tags: [opentrons, slot4]}
- {id: opentrons_4_low_press, arm: opentrons_4_low_press, rail: Home, 
    gripper_states: [grip_120], tags: [opentrons, slot4]}

- {id: opentrons_6_high, arm: opentrons_6_high, rail: Home, gripper_states: [
      empty, grip_120, reach_90, grip_80], tags: [opentrons, slot6]}
- {id: opentrons_6_low, arm: opentrons_6_low, rail: Home, gripper_states: [empty,
    grip_120, reach_90, grip_80], tags: [opentrons, slot6]}
- {id: opentrons_6_low_press, arm: opentrons_6_low_press, rail: Home, 
    gripper_states: [grip_120], tags: [opentrons, slot6]}

  # ── UPLC (rail Home). Pass-through in any gripper state. ──
- {id: uplc_home, arm: uplc_home, rail: Home, gripper_states: [empty, grip_120, 
      reach_90, grip_80], tags: [uplc, transit]}
  # drawer open/close subgraph
- {id: uplc_draw_home, arm: uplc_draw_home, rail: Home, gripper_states: [empty, 
      grip_120, reach_90, grip_80], tags: [uplc, drawer]}
- {id: uplc_draw_open_max, arm: uplc_draw_open_max, rail: Home, gripper_states: [
    empty, grip_120, reach_90, grip_80], tags: [uplc, drawer]}
- {id: uplc_draw_open_min, arm: uplc_draw_open_min, rail: Home, gripper_states: [
    empty, grip_120, reach_90, grip_80], tags: [uplc, drawer]}
- {id: uplc_draw_open_close, arm: uplc_draw_open_close, rail: Home, 
    gripper_states: [empty, grip_120, reach_90, grip_80], tags: [uplc, drawer]}
  # plate in/out poses
- {id: uplc_plate_home, arm: uplc_plate_home, rail: Home, gripper_states: [empty,
    grip_120, reach_90, grip_80], tags: [uplc, plate]}
- {id: uplc_plate_high, arm: uplc_plate_high, rail: Home, gripper_states: [empty,
    grip_120, reach_90, grip_80], tags: [uplc, plate]}
- {id: uplc_plate_in, arm: uplc_plate_in, rail: Home, gripper_states: [empty, 
      grip_120, reach_90, grip_80], tags: [uplc, plate]}

  # ── Deck (rail Deck=550). Transit + pick/place. Pass-through in any
  #    gripper state; grip/release only at the _low pick nodes. ──
- {id: deck_home, arm: deck_home, rail: Deck, gripper_states: [empty, grip_120, 
      reach_90, grip_80], tags: [deck, transit]}
- {id: deck_high, arm: deck_high, rail: Deck, gripper_states: [empty, grip_120, 
      reach_90, grip_80], tags: [deck, transit]}

- {id: deck_slot1_high, arm: deck_slot1_high, rail: Deck, gripper_states: [empty,
    grip_120, reach_90, grip_80], tags: [deck, slot1]}
- {id: deck_slot1_low, arm: deck_slot1_low, rail: Deck, gripper_states: [empty, 
      grip_120, reach_90, grip_80], gripper_transitions: [[empty, grip_120], [
        grip_120, empty]], tags: [deck, slot1]}
- {id: deck_slot1_low_press, arm: deck_slot1_low_press, rail: Deck, 
    gripper_states: [grip_120], tags: [deck, slot1]}

- {id: deck_slot2_high, arm: deck_slot2_high, rail: Deck, gripper_states: [empty,
    grip_120, reach_90, grip_80], tags: [deck, slot2]}
- {id: deck_slot2_low, arm: deck_slot2_low, rail: Deck, gripper_states: [empty, 
      grip_120, reach_90, grip_80], gripper_transitions: [[empty, grip_120], [
        grip_120, empty]], tags: [deck, slot2]}

- {id: deck_solid_high, arm: deck_solid_high, rail: Deck, gripper_states: [empty,
    grip_120, reach_90, grip_80], tags: [deck, solid]}
- {id: deck_solid_low, arm: deck_solid_low, rail: Deck, gripper_states: [empty, 
      grip_120, reach_90, grip_80], gripper_transitions: [[empty, grip_120], [
        grip_120, empty]], tags: [deck, solid]}
- {id: deck_solid_low_press, arm: deck_solid_low_press, rail: Deck, 
    gripper_states: [grip_120], tags: [deck, solid]}

  # ── Hood (rail Hood=550). shaker + filtration sub-stations. ──
- {id: hood_home, arm: hood_home, rail: Hood, gripper_states: [empty, grip_120, 
      reach_90, grip_80], tags: [hood, transit]}

- {id: hood_shaker_high, arm: hood_shaker_high, rail: Hood, gripper_states: [
      empty, grip_120, reach_90, grip_80], tags: [hood, shaker]}
- {id: hood_shaker_low, arm: hood_shaker_low, rail: Hood, gripper_states: [empty,
    grip_120, reach_90, grip_80], gripper_transitions: [[empty, grip_120], [
        grip_120, empty]], tags: [hood, shaker]}
- {id: hood_shaker_low_press, arm: hood_shaker_low_press, rail: Hood, 
    gripper_states: [grip_120], tags: [hood, shaker]}

- {id: hood_filter_home, arm: hood_filter_home, rail: Hood, gripper_states: [
      empty, grip_120, reach_90, grip_80], tags: [hood, filter]}
- {id: hood_filter_high, arm: hood_filter_high, rail: Hood, gripper_states: [
      empty, grip_120, reach_90, grip_80], tags: [hood, filter]}
- {id: hood_filter_low, arm: hood_filter_low, rail: Hood, gripper_states: [empty,
    grip_120, reach_90, grip_80], gripper_transitions: [[empty, grip_120], [
        grip_120, empty]], tags: [hood, filter]}
- {id: hood_filter_top_plate, arm: hood_filter_top_plate, rail: Hood, 
    gripper_states: [empty, grip_120, reach_90, grip_80], gripper_transitions: [[
      empty, grip_120], [grip_120, empty]], tags: [hood, filter]}

  # ── Cytation 5 reader (rail Cytation=700). Poses still being tuned on
  #    hardware (see position_config TODOs). ──
- {id: cytation_home, arm: cytation_home, rail: Cytation, gripper_states: [empty,
    grip_120, reach_90, grip_80], tags: [cytation, transit]}
- {id: cytation_high, arm: cytation_high, rail: Cytation, gripper_states: [empty,
    grip_120, reach_90, grip_80], tags: [cytation, plate]}
- {id: cytation_low, arm: cytation_low, rail: Cytation, gripper_states: [empty, 
      grip_120, reach_90, grip_80], tags: [cytation, plate]}

  # ── PlateLoc sealer (rail Plateloc=700). Poses still being tuned on
  #    hardware (see position_config TODOs). ──
- {id: plateloc_home, arm: plateloc_home, rail: Plateloc, gripper_states: [empty,
    grip_120, reach_90, grip_80], tags: [plateloc, transit]}
- {id: plateloc_high, arm: plateloc_high, rail: Plateloc, gripper_states: [empty,
    grip_120, reach_90, grip_80], tags: [plateloc, plate]}
- {id: plateloc_low, arm: plateloc_low, rail: Plateloc, gripper_states: [empty, 
      grip_120, reach_90, grip_80], tags: [plateloc, plate]}

# ── Edges: directional arm motions. The gripper never changes on an edge —
#    grip/release lives on the nodes' gripper_transitions above. Where the
#    old graph recorded separate empty/held variants of the same motion,
#    they are merged here keeping the held variant's mode and the lower
#    speed (safe for both states).
edges:
- from: robot_home
  to: uplc_draw_home
  mode: joint
  speed: 30
  comment: "Pre-position for UPLC drawer interaction."

- from: uplc_draw_home
  to: robot_home
  mode: joint
  speed: 30
  comment: "Retreat from UPLC drawer."

- from: uplc_draw_home
  to: uplc_draw_open_max
  mode: linear
  speed: 20
  comment: "Approach fully-open drawer position."

- from: uplc_draw_open_max
  to: uplc_draw_open_min
  mode: linear
  speed: 15
  comment: "Close drawer to almost-shut position (slow)."

- from: uplc_draw_open_min
  to: uplc_draw_open_close
  mode: linear
  speed: 5
  comment: "Final close - you should hear a click."

- from: uplc_draw_open_close
  to: uplc_draw_open_min
  mode: linear
  speed: 5
  comment: "Re-open drawer from click position."

- from: uplc_draw_open_min
  to: uplc_draw_open_max
  mode: linear
  speed: 15
  comment: "Open drawer fully."
- from: uplc_home
  to: uplc_draw_home
  mode: joint
  speed: 10.0
- from: uplc_draw_home
  to: uplc_home
  mode: joint
  speed: 10.0
- from: deck_high
  to: deck_home
  mode: joint
  speed: 20.0
- from: deck_home
  to: deck_high
  mode: joint
  speed: 20.0
- from: deck_high
  to: deck_slot1_high
  mode: joint
  speed: 20.0
- from: deck_slot1_high
  to: deck_slot1_low
  mode: linear
  speed: 10.0
- from: deck_slot1_low
  to: deck_slot1_high
  mode: linear
  speed: 15.0
- from: deck_slot1_high
  to: deck_high
  mode: joint
  speed: 20.0
- from: robot_home
  to: opentrons_home
  mode: joint
  speed: 25.0
- from: opentrons_home
  to: robot_home
  mode: joint
  speed: 25.0
- from: uplc_home
  to: robot_home
  mode: joint
  speed: 25.0
- from: robot_home
  to: uplc_home
  mode: joint
  speed: 25.0
- from: robot_home
  to: deck_home
  mode: joint
  speed: 25.0
- from: deck_home
  to: robot_home
  mode: joint
  speed: 25.0
- from: robot_home
  to: hood_home
  mode: joint
  speed: 25.0
- from: hood_home
  to: robot_home
  mode: joint
  speed: 25.0
- from: deck_high
  to: deck_slot2_high
  mode: joint
- from: deck_slot2_high
  to: deck_slot2_low
  mode: linear
- from: deck_slot2_high
  to: deck_high
  mode: joint
- from: deck_slot2_low
  to: deck_slot2_high
  mode: linear
- from: deck_high
  to: deck_solid_high
  mode: joint
- from: deck_solid_high
  to: deck_high
  mode: joint
- from: deck_solid_high
  to: deck_solid_low
  mode: linear
- from: deck_solid_low
  to: deck_solid_high
  mode: linear
- from: hood_home
  to: hood_filter_home
  mode: joint
- from: hood_filter_home
  to: hood_home
  mode: joint
- from: hood_filter_home
  to: hood_filter_high
  mode: joint
- from: hood_filter_high
  to: hood_filter_home
  mode: joint
- from: hood_filter_high
  to: hood_filter_low
  mode: linear
- from: hood_filter_low
  to: hood_filter_high
  mode: linear
- from: uplc_home
  to: uplc_plate_home
  mode: joint
- from: uplc_plate_home
  to: uplc_home
  mode: joint
- from: hood_filter_top_plate
  to: hood_filter_high
  mode: linear
- from: hood_filter_high
  to: hood_filter_top_plate
  mode: linear
- from: hood_home
  to: hood_shaker_high
  mode: joint
- from: hood_shaker_high
  to: hood_home
  mode: joint
- from: hood_shaker_high
  to: hood_shaker_low
  mode: linear
- from: hood_shaker_low
  to: hood_shaker_high
  mode: linear
- from: opentrons_home
  to: opentrons_2_high
  mode: joint
- from: opentrons_2_high
  to: opentrons_home
  mode: joint
- from: opentrons_2_low
  to: opentrons_2_high
  mode: linear
- from: opentrons_2_high
  to: opentrons_2_low
  mode: linear
