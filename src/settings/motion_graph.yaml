# Motion-graph interlock data.
#
# A NODE is a STATE = a named arm pose from position_config.yaml (the `arm`
# field) combined with a rail location, a gripper state, and a payload.
# Poses that are visited both empty-handed and while holding a plate are
# split into two nodes (`<pose>_empty` / `<pose>_held`); a pose with only
# one meaningful state keeps the bare pose name. EDGES are the motions
# between states and are mostly discovered on hardware via `record`.
#
# Loader enforces coherence at startup (src/core/motion_graph.py::
# _validate_topology): a non-empty payload may not use the fully-open
# gripper; payload-changing edges must carry the matching grip/release
# action; non-changing edges must not.
#
# Rail locations (linear_track_config.yaml): Home=0, Deck=550, Hood=550,
# Cytation=700, Plateloc=0(placeholder). cytation_*/plateloc_* poses are
# all-zero TODOs in position_config.yaml and are intentionally NOT modelled
# as nodes yet.

schema_version: "0.1"

# ── Gripper states: commanded mechanical positions only (bio_gen2 stroke
#    range 71-150). grip_plate must stay < 150 so a held node stays
#    coherent (rule 1: a payload can't be held with a fully-open gripper).
gripper_states:
  open:       { stroke: 150 }   # fully open
  closed:     { stroke: 71 }    # fully closed (empty)
  grip_plate: { stroke: 100 }   # grips a 96-well plate; TUNE on hardware

# ── Payloads: held-item identities. `empty` is the no-payload sentinel.
payloads:
  empty: {}
  plate_96: { description: "96-well microplate" }

# ── Nodes: grounded 1:1 in position_config.yaml poses. Empty = gripper
#    open / payload empty; held = gripper grip_plate / payload plate_96.
nodes:
  # ── Generic safe poses (rail Home), empty-only ──
  - { id: robot_home,       arm: robot_home,       rail: Home, gripper: open, payload: empty, tags: [safe, home] }
  - { id: robot_home_back,  arm: robot_home_back,  rail: Home, gripper: open, payload: empty, tags: [safe] }
  - { id: robot_home_left,  arm: robot_home_left,  rail: Home, gripper: open, payload: empty, tags: [safe] }
  - { id: robot_home_right, arm: robot_home_right, rail: Home, gripper: open, payload: empty, tags: [safe] }

  # ── Opentrons OT-2 (rail Home). Per-slot pick/place: high/low split
  #    empty/held; low_press is held-only. ──
  - { id: opentrons_home, arm: opentrons_home, rail: Home, gripper: open, payload: empty, tags: [opentrons, transit] }

  - { id: opentrons_2_high_empty, arm: opentrons_2_high, rail: Home, gripper: open,       payload: empty,    tags: [opentrons, slot2] }
  - { id: opentrons_2_high_held,  arm: opentrons_2_high, rail: Home, gripper: grip_plate, payload: plate_96, tags: [opentrons, slot2] }
  - { id: opentrons_2_low_empty,  arm: opentrons_2_low,  rail: Home, gripper: open,       payload: empty,    tags: [opentrons, slot2] }
  - { id: opentrons_2_low_held,   arm: opentrons_2_low,  rail: Home, gripper: grip_plate, payload: plate_96, tags: [opentrons, slot2] }
  - { id: opentrons_2_low_press,  arm: opentrons_2_low_press, rail: Home, gripper: grip_plate, payload: plate_96, tags: [opentrons, slot2] }

  - { id: opentrons_4_high_empty, arm: opentrons_4_high, rail: Home, gripper: open,       payload: empty,    tags: [opentrons, slot4] }
  - { id: opentrons_4_high_held,  arm: opentrons_4_high, rail: Home, gripper: grip_plate, payload: plate_96, tags: [opentrons, slot4] }
  - { id: opentrons_4_low_empty,  arm: opentrons_4_low,  rail: Home, gripper: open,       payload: empty,    tags: [opentrons, slot4] }
  - { id: opentrons_4_low_held,   arm: opentrons_4_low,  rail: Home, gripper: grip_plate, payload: plate_96, tags: [opentrons, slot4] }
  - { id: opentrons_4_low_press,  arm: opentrons_4_low_press, rail: Home, gripper: grip_plate, payload: plate_96, tags: [opentrons, slot4] }

  - { id: opentrons_6_high_empty, arm: opentrons_6_high, rail: Home, gripper: open,       payload: empty,    tags: [opentrons, slot6] }
  - { id: opentrons_6_high_held,  arm: opentrons_6_high, rail: Home, gripper: grip_plate, payload: plate_96, tags: [opentrons, slot6] }
  - { id: opentrons_6_low_empty,  arm: opentrons_6_low,  rail: Home, gripper: open,       payload: empty,    tags: [opentrons, slot6] }
  - { id: opentrons_6_low_held,   arm: opentrons_6_low,  rail: Home, gripper: grip_plate, payload: plate_96, tags: [opentrons, slot6] }
  - { id: opentrons_6_low_press,  arm: opentrons_6_low_press, rail: Home, gripper: grip_plate, payload: plate_96, tags: [opentrons, slot6] }

  # ── UPLC (rail Home), empty-only ("no payload allowed" in position_config). ──
  - { id: uplc_home,            arm: uplc_home,            rail: Home, gripper: open, payload: empty, tags: [uplc, transit] }
  # drawer open/close subgraph
  - { id: uplc_draw_home,       arm: uplc_draw_home,       rail: Home, gripper: open, payload: empty, tags: [uplc, drawer] }
  - { id: uplc_draw_open_max,   arm: uplc_draw_open_max,   rail: Home, gripper: open, payload: empty, tags: [uplc, drawer] }
  - { id: uplc_draw_open_min,   arm: uplc_draw_open_min,   rail: Home, gripper: open, payload: empty, tags: [uplc, drawer] }
  - { id: uplc_draw_open_close, arm: uplc_draw_open_close, rail: Home, gripper: open, payload: empty, tags: [uplc, drawer] }
  # plate in/out poses
  - { id: uplc_plate_home,      arm: uplc_plate_home,      rail: Home, gripper: open, payload: empty, tags: [uplc, plate] }
  - { id: uplc_plate_high,      arm: uplc_plate_high,      rail: Home, gripper: open, payload: empty, tags: [uplc, plate] }
  - { id: uplc_plate_in,        arm: uplc_plate_in,        rail: Home, gripper: open, payload: empty, tags: [uplc, plate] }

  # ── Deck (rail Deck=550). deck_home/deck_high are transit (empty);
  #    slot1/slot2/solid are pick/place (high/low split, press held-only). ──
  - { id: deck_home, arm: deck_home, rail: Deck, gripper: open, payload: empty, tags: [deck, transit] }
  - { id: deck_high, arm: deck_high, rail: Deck, gripper: open, payload: empty, tags: [deck, transit] }

  - { id: deck_slot1_high_empty, arm: deck_slot1_high, rail: Deck, gripper: open,       payload: empty,    tags: [deck, slot1] }
  - { id: deck_slot1_high_held,  arm: deck_slot1_high, rail: Deck, gripper: grip_plate, payload: plate_96, tags: [deck, slot1] }
  - { id: deck_slot1_low_empty,  arm: deck_slot1_low,  rail: Deck, gripper: open,       payload: empty,    tags: [deck, slot1] }
  - { id: deck_slot1_low_held,   arm: deck_slot1_low,  rail: Deck, gripper: grip_plate, payload: plate_96, tags: [deck, slot1] }
  - { id: deck_slot1_low_press,  arm: deck_slot1_low_press, rail: Deck, gripper: grip_plate, payload: plate_96, tags: [deck, slot1] }

  - { id: deck_slot2_high_empty, arm: deck_slot2_high, rail: Deck, gripper: open,       payload: empty,    tags: [deck, slot2] }
  - { id: deck_slot2_high_held,  arm: deck_slot2_high, rail: Deck, gripper: grip_plate, payload: plate_96, tags: [deck, slot2] }
  - { id: deck_slot2_low_empty,  arm: deck_slot2_low,  rail: Deck, gripper: open,       payload: empty,    tags: [deck, slot2] }
  - { id: deck_slot2_low_held,   arm: deck_slot2_low,  rail: Deck, gripper: grip_plate, payload: plate_96, tags: [deck, slot2] }

  - { id: deck_solid_high_empty, arm: deck_solid_high, rail: Deck, gripper: open,       payload: empty,    tags: [deck, solid] }
  - { id: deck_solid_high_held,  arm: deck_solid_high, rail: Deck, gripper: grip_plate, payload: plate_96, tags: [deck, solid] }
  - { id: deck_solid_low_empty,  arm: deck_solid_low,  rail: Deck, gripper: open,       payload: empty,    tags: [deck, solid] }
  - { id: deck_solid_low_held,   arm: deck_solid_low,  rail: Deck, gripper: grip_plate, payload: plate_96, tags: [deck, solid] }
  - { id: deck_solid_low_press,  arm: deck_solid_low_press, rail: Deck, gripper: grip_plate, payload: plate_96, tags: [deck, solid] }

  # ── Hood (rail Hood=550). shaker + filtration sub-stations. ──
  - { id: hood_home, arm: hood_home, rail: Hood, gripper: open, payload: empty, tags: [hood, transit] }

  - { id: hood_shaker_high_empty, arm: hood_shaker_high, rail: Hood, gripper: open,       payload: empty,    tags: [hood, shaker] }
  - { id: hood_shaker_high_held,  arm: hood_shaker_high, rail: Hood, gripper: grip_plate, payload: plate_96, tags: [hood, shaker] }
  - { id: hood_shaker_low_empty,  arm: hood_shaker_low,  rail: Hood, gripper: open,       payload: empty,    tags: [hood, shaker] }
  - { id: hood_shaker_low_held,   arm: hood_shaker_low,  rail: Hood, gripper: grip_plate, payload: plate_96, tags: [hood, shaker] }
  - { id: hood_shaker_low_press,  arm: hood_shaker_low_press, rail: Hood, gripper: grip_plate, payload: plate_96, tags: [hood, shaker] }

  - { id: hood_filter_home, arm: hood_filter_home, rail: Hood, gripper: open, payload: empty, tags: [hood, filter] }
  - { id: hood_filter_high_empty, arm: hood_filter_high, rail: Hood, gripper: open,       payload: empty,    tags: [hood, filter] }
  - { id: hood_filter_high_held,  arm: hood_filter_high, rail: Hood, gripper: grip_plate, payload: plate_96, tags: [hood, filter] }
  - { id: hood_filter_low_empty,  arm: hood_filter_low,  rail: Hood, gripper: open,       payload: empty,    tags: [hood, filter] }
  - { id: hood_filter_low_held,   arm: hood_filter_low,  rail: Hood, gripper: grip_plate, payload: plate_96, tags: [hood, filter] }
  - { id: hood_filter_top_plate_empty, arm: hood_filter_top_plate, rail: Hood, gripper: open,       payload: empty,    tags: [hood, filter] }
  - { id: hood_filter_top_plate_held,  arm: hood_filter_top_plate, rail: Hood, gripper: grip_plate, payload: plate_96, tags: [hood, filter] }

# ── Edges: directional motions. Only the UPLC drawer subgraph is authored
#    here (it predates this file and is hand-verified). All other station
#    edges are discovered on hardware via POST /control/graph/record.
#    These are all empty->empty moves, so they carry no grip/release action.
edges:
  - from: robot_home
    to:   uplc_draw_home
    mode: joint
    speed: 30
    comment: "Pre-position for UPLC drawer interaction."

  - from: uplc_draw_home
    to:   robot_home
    mode: joint
    speed: 30
    comment: "Retreat from UPLC drawer."

  - from: uplc_draw_home
    to:   uplc_draw_open_max
    mode: linear
    speed: 20
    comment: "Approach fully-open drawer position."

  - from: uplc_draw_open_max
    to:   uplc_draw_open_min
    mode: linear
    speed: 15
    preconditions: [gripper_empty]
    comment: "Close drawer to almost-shut position (slow)."

  - from: uplc_draw_open_min
    to:   uplc_draw_open_close
    mode: linear
    speed: 5
    preconditions: [gripper_empty]
    comment: "Final close - you should hear a click."

  - from: uplc_draw_open_close
    to:   uplc_draw_open_min
    mode: linear
    speed: 5
    comment: "Re-open drawer from click position."

  - from: uplc_draw_open_min
    to:   uplc_draw_open_max
    mode: linear
    speed: 15
    comment: "Open drawer fully."
